[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline"
version = "0.1.0"
description = "Computer vision evaluation pipeline for face detection, actor verification, and manipulation analysis"
authors = [{ name = "Muhammad Anas" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.23.0",
    "opencv-python-headless>=4.8.0",
    "onnxruntime>=1.15.0",
    "insightface>=0.7.3",
    "transformers>=4.35.0",
    "huggingface-hub>=0.19.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
